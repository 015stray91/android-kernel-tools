name: AnyRealm Genevn Kernel Build

on:
  push:
    branches: [ "android-14-release-u1tgns34.42-86-2-32" ]
  workflow_dispatch:

# Add this global env block right here
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  compile-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Workspace Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Checkout Core Kernel Tree
        uses: actions/checkout@v4
        with:
          repository: '015stray91/kernel-msm-1'
          path: 'kernel-source'
          ref: 'android-14-release-u1tgns34.42-86-2-32'
          fetch-depth: 1

      - name: Checkout Snapdragon Static Toolchain
        uses: actions/checkout@v4
        with:
          repository: '015stray91/android-kernel-tools'
          path: 'tools'
          fetch-depth: 1

      - name: Provision Legacy Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5 libtinfo5 libssl-dev xz-utils flex bison python3-distutils jq curl unzip

      - name: Inject Decoupled OpenCode Forks Dynamically
        run: |
          cd kernel-source
          TARGET_TAG="MMI-U1TGNS34.42-86-2-32"
          
          # Fetch all public repositories from your profile
          USER_REPOS=$(curl -s "https://github.com/015stray91" | jq -r '.[].name')
          
          for REPO in $USER_REPOS; do
            if [[ "$REPO" == *"techpack"* || "$REPO" == *"drivers-external"* || "$REPO" == *"motorola-"* ]]; then
              
              # Translate repository naming logic directly into the GKI 1.0 layout paths
              TARGET_DIR=$(echo "$REPO" | sed 's/-/ \+/g' | sed 's/techpack /techpack\//g' | sed 's/drivers external /drivers\/external\//g' | sed 's/motorola hardware /drivers\/hardware\//g' | tr -d ' ')
              
              echo "Injecting Decoupled Component: $REPO @ Tag: $TARGET_TAG -> $TARGET_DIR"
              rm -rf "$TARGET_DIR"
              
              # Clone the specific release tag provided by your instructions
              git clone --depth=1 --branch "$TARGET_TAG" "https://github.com{REPO}.git" "$TARGET_DIR" || {
                echo "Warning: Tag match failed for $REPO, utilizing fallback default branch."
                git clone --depth=1 "https://github.com{REPO}.git" "$TARGET_DIR"
              }
            fi
          done

      - name: Execute Parallel Kernel Compilation
        run: |
          cd kernel-source
          
          # 1. Establish path routing to your static compiler tools
          export PATH="${{ github.workspace }}/tools/clang/host/linux-x86/clang-r416183b/bin:${{ github.workspace }}/tools/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/tools/clang/host/linux-x86/clang-r416183b/lib64:$LD_LIBRARY_PATH"
          
          # 2. Hard-force compilation architecture parameters
          export ARCH=arm64
          export SUBARCH=ARM64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          # 3. Handle structure cleaning and explicit config stacking
          make O=out clean mrproper
          make O=out gki_defconfig
          
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/genevn_config
            
          make O=out olddefconfig
          
          # 4. Fire compilation loop completely locked to static Clang 12
          make O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            OBJDUMP=llvm-objdump \
            OBJCOPY=llvm-objcopy \
            -j$(nproc --all)

      - name: Archive Built Kernel Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Genevn-Kernel
          path: |
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/drivers/**/*.ko
